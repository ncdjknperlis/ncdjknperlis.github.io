<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log Masuk Pentadbir - Kesihatan Mental</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
    .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
    .form-control-custom { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 16px; }
    .btn-primary-custom { background: #2563eb; color: white; font-weight: 700; border: none; border-radius: 12px; padding: 14px; box-shadow: 0 10px 20px rgba(37,99,235,0.2); }
    .btn-primary-custom:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card text-center">
    <img src="https://lh3.googleusercontent.com/d/1lIkdT2BsA51EX-CoF_lpWluaAGDraz_y" alt="Logo" class="img-fluid mb-3" style="max-height: 85px;">
    
    <div class="mb-4">
      <h4 class="fw-bold">Portal Pentadbir</h4>
      <p class="text-muted fs-6">Sistem Saringan Kesihatan Mental</p>
    </div>

    <div class="text-start mb-3">
      <label class="form-label fw-semibold fs-6">Username</label>
      <input type="text" class="form-control form-control-custom" id="adminUser" placeholder="Masukkan username">
    </div>

    <div class="text-start mb-4">
      <label class="form-label fw-semibold fs-6">Kata Laluan</label>
      <input type="password" class="form-control form-control-custom" id="adminPass" placeholder="Masukkan kata laluan">
    </div>

    <div id="loginAlert" class="alert alert-danger py-2 mb-3" style="display:none; font-size:0.85rem;"></div>

    <button class="btn btn-primary-custom w-100" id="btnLogin" onclick="submitAdminLogin()">Log Masuk Admin ➔</button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwkLkwga-kdvyP8kSzmm7gnf_f0w3R7Jx5ex0YLoxy4PnsgH6PSYeWQ3Oz_7Rsg27Pr/exec";

  document.addEventListener("DOMContentLoaded", function() {
    // Jika dah ada session, terus redirect ke dashboard.html
    if (localStorage.getItem("admin_session")) {
      window.location.href = "dashboard.html";
    }
  });

  function submitAdminLogin() {
    const u = document.getElementById('adminUser').value.trim();
    const p = document.getElementById('adminPass').value.trim();
    const btn = document.getElementById('btnLogin');
    const alertBox = document.getElementById('loginAlert');

    if(!u || !p) { alertBox.innerText = "Sila isi Username & Kata Laluan."; alertBox.style.display="block"; return; }

    btn.disabled = true;
    btn.innerText = "Mengesahkan Akaun...";
    const creds = { username: u, password: p };

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "adminLogin", credentials: creds })
    })
    .then(r => r.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "Log Masuk Admin ➔";

      if(res.status === "success") {
        localStorage.setItem("admin_session", JSON.stringify(creds));
        window.location.href = "dashboard.html";
      } else {
        alertBox.innerText = res.message;
        alertBox.style.display = "block";
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "Log Masuk Admin ➔";
      alertBox.innerText = "Ralat Rangkaian API";
      alertBox.style.display = "block";
    });
  }
</script>

</body>
</html>
